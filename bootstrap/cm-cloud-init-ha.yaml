#cloud-config

hostname: ${hostname}
fqdn: ${hostname}
manage_etc_hosts: true

package_update: true

packages:
  - curl
  - ca-certificates
  - git
  - jq
  - tar
  - python3
  - python3-pip
  - python3-venv
  - ufw
  - gnupg
  - psmisc

write_files:

  - path: /etc/phase8/cm-identity-client-id
    permissions: "0644"
    owner: root:root
    content: "${cm_identity_client_id}"

  # ------------------------------------------------------------
  # Install Tailscale
  # ------------------------------------------------------------
  - path: /usr/local/bin/install-tailscale.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      if command -v tailscale >/dev/null 2>&1; then
        echo "Tailscale already installed."
        tailscale version
        exit 0
      fi

      echo "Installing Tailscale..."
      curl -fsSL "https://raw.githubusercontent.com/tailscale/tailscale/v${tailscale_package_version}/scripts/installer.sh" \
        | TAILSCALE_VERSION="${tailscale_package_version}" sh
      tailscale version

  # ------------------------------------------------------------
  # Join Tailscale using Azure Managed Identity + WIF
  # ------------------------------------------------------------
  - path: /usr/local/bin/join-tailscale.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      TS_STATUS="$(tailscale status --json 2>/dev/null | jq -r '.BackendState // empty' || true)"

      if [ "$${TS_STATUS}" = "Running" ]; then
        echo "Tailscale is already Running."
        exit 0
      fi

      echo "Waiting for Azure Managed Identity..."
      AZURE_JWT_TOKEN=""

      for i in {1..30}; do
        AZURE_JWT_TOKEN="$(curl -fsS -H Metadata:true "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2019-08-01&resource=api://AzureADTokenExchange" | jq -r '.access_token // empty')" || true

        if [ -n "$${AZURE_JWT_TOKEN}" ]; then
          echo "Azure Managed Identity token acquired."
          break
        fi

        echo "Managed Identity not ready. Retry $${i}/30..."
        sleep 3
      done

      if [ -z "$${AZURE_JWT_TOKEN}" ]; then
        echo "ERROR: Failed to obtain Azure Managed Identity token."
        exit 1
      fi

      echo "Joining Tailscale..."
      tailscale up --reset --id-token="$${AZURE_JWT_TOKEN}" --client-id="${tailscale_cm_client_id}" --audience="${tailscale_cm_audience}" --advertise-tags=tag:cm --hostname="$(hostname)" --ssh

      unset AZURE_JWT_TOKEN
      echo "Tailscale join completed."
      tailscale status

  # ------------------------------------------------------------
  # Automatically join Tailscale after tailscaled is ready
  # ------------------------------------------------------------
  - path: /etc/systemd/system/tailscale-auto-join.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Tailscale Auto-Join with Azure OIDC
      After=network-online.target tailscaled.service
      Wants=network-online.target tailscaled.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/join-tailscale.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

runcmd:
  runcmd:
  # Create 2 GB swap
  - [ sh, -c, "if [ ! -f /swapfile ]; then fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048; fi" ]
  - [ sh, -c, "chmod 600 /swapfile" ]
  - [ sh, -c, "if ! swapon --show | grep -q '/swapfile'; then mkswap /swapfile || true; swapon /swapfile; fi" ]
  - [ sh, -c, "if ! grep -q '^/swapfile ' /etc/fstab; then echo '/swapfile swap swap defaults 0 0' >> /etc/fstab; fi" ]

  # Tinh chỉnh swappiness để ưu tiên RAM vật lý trước khi đẩy ra Swap
  - [ sh, -c, "sysctl vm.swappiness=10" ]
  - [ sh, -c, "if ! grep -q '^vm.swappiness' /etc/sysctl.d/99-swappiness.conf 2>/dev/null; then echo 'vm.swappiness=10' > /etc/sysctl.d/99-swappiness.conf; fi" ]

  # Keep host management on Tailscale; Azure NSG denies direct VM SSH.
  - [ ufw, --force, enable ]

  # Install and enable Tailscale.
  - [ /usr/local/bin/install-tailscale.sh ]
  - [ systemctl, enable, --now, tailscaled ]

  # Join Tailscale using the attached CM Managed Identity.
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, tailscale-auto-join.service ]
  - [ ufw, allow, in, on, tailscale0, to, any, port, "22", proto, tcp ]

  # Install the exact Azure CLI package used for managed-identity inventory discovery.
  - [ sh, -c, "install -d -m 0755 /etc/apt/keyrings" ]
  - [ sh, -c, "curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor --yes -o /etc/apt/keyrings/microsoft.gpg && chmod 0644 /etc/apt/keyrings/microsoft.gpg" ]
  - [ sh, -c, "echo 'deb [arch=arm64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ noble main' > /etc/apt/sources.list.d/azure-cli.list" ]
  - [ sh, -c, "export DEBIAN_FRONTEND=noninteractive && apt-get update && apt-get install -y azure-cli=${azure_cli_version}" ]

  # Create a pinned Ansible runtime for control-plane operations.
  - [ python3, -m, venv, /opt/ansible-venv ]
  - [ /opt/ansible-venv/bin/pip, install, ansible-core==2.19.1 ]
  - [ ln, -sf, /opt/ansible-venv/bin/ansible, /usr/local/bin/ansible ]
  - [ ln, -sf, /opt/ansible-venv/bin/ansible-playbook, /usr/local/bin/ansible-playbook ]
  - [ ln, -sf, /opt/ansible-venv/bin/ansible-inventory, /usr/local/bin/ansible-inventory ]
  - [ ln, -sf, /opt/ansible-venv/bin/ansible-galaxy, /usr/local/bin/ansible-galaxy ]

  # Pin the collection version for repeatable control-node runs.
  - [ sudo, -u, azureadmin, /opt/ansible-venv/bin/ansible-galaxy, collection, install, community.general:11.4.0 ]

  # Clone the repository. The protected deployment workflow checks out the exact reviewed SHA before applying configuration.
  - [ sh, -c, "if [ ! -d /home/azureadmin/hybrid-infra-lab-ha ]; then sudo -u azureadmin git clone https://github.com/johnyhdev/hybrid-infra-lab-ha.git /home/azureadmin/hybrid-infra-lab-ha; fi" ]
  - [ chown, -R, "azureadmin:azureadmin", /home/azureadmin/ ]

  # Completion marker
  - [ touch, /var/log/cloud-init-done.tag ]