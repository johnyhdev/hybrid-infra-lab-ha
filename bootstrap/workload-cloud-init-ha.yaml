#cloud-config
hostname: ${hostname}
fqdn: ${hostname}
manage_etc_hosts: true
package_update: true
packages:
  - curl
  - jq
  - ca-certificates
  - ufw
  - gnupg

write_files:
  # ------------------------------------------------------------
  # Install Tailscale (Đồng bộ chuẩn từ CM)
  # ------------------------------------------------------------
  - path: /usr/local/bin/install-tailscale.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      if command -v tailscale >/dev/null 2>&1; then
        echo "Tailscale already installed."
        tailscale version
        exit 0
      fi

      echo "Installing Tailscale..."
      curl -fsSL "https://raw.githubusercontent.com/tailscale/tailscale/v${tailscale_package_version}/scripts/installer.sh" \
        | TAILSCALE_VERSION="${tailscale_package_version}" sh
      tailscale version

  # ------------------------------------------------------------
  # Join Tailscale using Azure Managed Identity + WIF (Dành riêng Workload)
  # ------------------------------------------------------------
  - path: /usr/local/bin/join-tailscale.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      TS_STATUS="$(tailscale status --json 2>/dev/null | jq -r '.BackendState // empty' || true)"

      if [ "$${TS_STATUS}" = "Running" ]; then
        echo "Tailscale is already Running."
        exit 0
      fi

      echo "Waiting for Azure Managed Identity..."
      AZURE_JWT_TOKEN=""

      for i in {1..30}; do
        AZURE_JWT_TOKEN="$(curl -fsS -H Metadata:true "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2019-08-01&resource=api://AzureADTokenExchange&client_id=${workload_identity_client_id}" | jq -r '.access_token // empty')" || true

        if [ -n "$${AZURE_JWT_TOKEN}" ]; then
          echo "Azure Managed Identity token acquired."
          break
        fi

        echo "Managed Identity not ready. Retry $${i}/30..."
        sleep 3
      done

      if [ -z "$${AZURE_JWT_TOKEN}" ]; then
        echo "ERROR: Failed to obtain Azure Managed Identity token."
        exit 1
      fi

      echo "Joining Tailscale..."
      echo "DEBUG Client ID: ${tailscale_workload_client_id}"
      echo "DEBUG Audience: ${tailscale_workload_audience}"
      tailscale up --reset --id-token="$${AZURE_JWT_TOKEN}" --client-id="${tailscale_workload_client_id}" --audience="${tailscale_workload_audience}" --advertise-tags=tag:workload --hostname="$(hostname)" --ssh

      unset AZURE_JWT_TOKEN
      echo "Tailscale join completed."
      tailscale status

  # ------------------------------------------------------------
  # Automatically join Tailscale after tailscaled is ready
  # ------------------------------------------------------------
  - path: /etc/systemd/system/tailscale-auto-join.service
    permissions: "0644"
    owner: root:root
    content: |
      [Unit]
      Description=Tailscale Auto-Join with Azure OIDC (Workload)
      After=network-online.target tailscaled.service
      Wants=network-online.target tailscaled.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/join-tailscale.sh
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Keep host management on Tailscale; Azure NSG denies direct VM SSH.
  - [ ufw, --force, enable ]

  # Install and enable Tailscale using the robust script
  - [ /usr/local/bin/install-tailscale.sh ]
  - [ systemctl, enable, --now, tailscaled ]

  # Join Tailscale using the attached Workload Managed Identity.
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, tailscale-auto-join.service ]
  - [ ufw, allow, in, on, tailscale0, to, any, port, "22", proto, tcp ]