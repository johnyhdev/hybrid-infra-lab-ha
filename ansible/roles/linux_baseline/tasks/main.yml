---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Require exact OS package versions
  ansible.builtin.assert:
    that:
      - package_versions.nginx is defined
      - package_versions.python3 is defined
      - package_versions.postgresql is defined
      - "'REPLACE_' not in package_versions.nginx"
      - "'REPLACE_' not in package_versions.python3"
      - "'REPLACE_' not in package_versions.postgresql"
      - "'*' not in package_versions.nginx"
      - "'*' not in package_versions.python3"
      - "'*' not in package_versions.postgresql"
    fail_msg: Populate exact Ubuntu package versions in ansible/group_vars/all.yml before deployment.

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - jq
      - unzip
      - vim
      - htop
      - net-tools
      - ca-certificates
      - gnupg
      - lsof
      - rsync
      - "python3={{ package_versions.python3 }}"
      - "nginx={{ package_versions.nginx }}"
      - python3-pip
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone | default('Asia/Ho_Chi_Minh') }}"

- name: Ensure admin user exists
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups:
      - sudo
      - adm
    append: true
    shell: /bin/bash
    state: present

- name: Configure sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ ansible_user }}"
    content: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"

- name: Ensure SSH service is enabled
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH in UFW only via Tailscale
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp
    interface: tailscale0
    direction: in

- name: Allow Tailscale direct peer transport from the VNet
  community.general.ufw:
    rule: allow
    port: '41641'
    proto: udp
    src: "{{ vnet_cidr }}"

- name: Allow workload web backend from workload subnet
  community.general.ufw:
    rule: allow
    port: "{{ workload_web_port }}"
    proto: tcp
    src: "{{ workload_plane_subnet_cidr | default('10.20.2.0/23') }}"

- name: Allow workload proxy health and backend traffic from workload subnet
  community.general.ufw:
    rule: allow
    port: "{{ workload_proxy_port }}"
    proto: tcp
    src: "{{ workload_plane_subnet_cidr | default('10.20.2.0/23') }}"

- name: Allow Azure Load Balancer health probes to the workload proxy
  community.general.ufw:
    rule: allow
    port: "{{ workload_proxy_port }}"
    proto: tcp
    src: 168.63.129.16
  when: enable_load_balancer | default(false) | bool

- name: Allow Node Exporter (9100) in UFW from Control Subnet
  community.general.ufw:
    rule: allow
    port: '9100'
    proto: tcp
    src: "{{ control_plane_subnet_cidr | default('10.20.1.0/24') }}"

- name: Enable UFW service
  community.general.ufw:
    state: enabled
    policy: deny