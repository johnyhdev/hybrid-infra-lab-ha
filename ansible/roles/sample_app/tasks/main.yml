- name: Create application directory
  ansible.builtin.file:
    path: /opt/sample-app
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create unprivileged sample application account
  ansible.builtin.user:
    name: sample-app
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/sample-app
    create_home: true
    state: present

- name: Install PostgreSQL-backed transactional sample application
  ansible.builtin.copy:
    src: app.py
    dest: /opt/sample-app/app.py
    owner: root
    group: root
    mode: "0644"
  notify: Restart sample app

- name: Create systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/sample-app.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Hybrid Infrastructure Lab Sample App
      After=network.target

      [Service]
      Type=simple
      User=sample-app
      Group=sample-app
      ExecStart=/usr/bin/python3 /opt/sample-app/app.py
      Environment=PHASE8_DB_CONFIG=/etc/phase8-postgresql/app.json
      Environment=PHASE8_APP_PORT={{ sample_app_port }}
      Restart=on-failure
      RestartSec=5
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      ReadOnlyPaths=/opt/sample-app /etc/phase8-postgresql
      ReadWritePaths=/var/lib/sample-app

      [Install]
      WantedBy=multi-user.target
  notify: Restart sample app

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start sample application
  ansible.builtin.systemd:
    name: sample-app
    enabled: true
    state: started

- name: Apply application changes before dependent roles
  ansible.builtin.meta: flush_handlers
    