---
- name: Restart Prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted

- name: Restart Alertmanager
  ansible.builtin.systemd:
    name: prometheus-alertmanager
    state: restarted

- name: Restart Grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted

- name: Restart Loki
  ansible.builtin.systemd:
    name: loki
    state: restarted

- name: Reload systemd manager
  ansible.builtin.systemd:
    daemon_reload: true
