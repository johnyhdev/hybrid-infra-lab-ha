---

- name: Install Nginx
  ansible.builtin.apt:
    name: "nginx={{ package_versions.nginx }}"
    state: present
    update_cache: true

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Deploy lab Nginx configuration
  ansible.builtin.template:
    src: lab.conf.j2
    dest: /etc/nginx/sites-available/lab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart nginx

- name: Enable lab Nginx configuration
  ansible.builtin.file:
    src: /etc/nginx/sites-available/lab.conf
    dest: /etc/nginx/sites-enabled/lab.conf
    state: link
  notify: Restart nginx

- name: Enable Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Validate active Nginx configuration
  ansible.builtin.command:
    argv:
      - nginx
      - -t
  changed_when: false

- name: Apply validated Nginx configuration
  ansible.builtin.meta: flush_handlers

- name: Check local application HTTP health
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ sample_app_port }}/"
    status_code: 200
    return_content: true
  register: local_app_health
  retries: 10
  delay: 2
  until: local_app_health.status == 200
  changed_when: false
