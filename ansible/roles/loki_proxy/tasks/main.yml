---
- name: Install pinned Nginx for the local Loki failover proxy
  ansible.builtin.apt:
    name: "nginx={{ package_versions.nginx }}"
    state: present
    update_cache: true

- name: Remove the default Nginx site on control managers
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: inventory_hostname in groups['control']
  notify: Restart Loki proxy

- name: Install local-only Loki failover proxy configuration
  ansible.builtin.template:
    src: loki-proxy.conf.j2
    dest: /etc/nginx/conf.d/phase8-loki-proxy.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Loki proxy

- name: Validate Nginx configuration including Loki failover proxy
  ansible.builtin.command:
    argv: [nginx, -t]
  changed_when: false

- name: Enable Nginx for local Loki failover proxy
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Apply validated Loki proxy changes
  ansible.builtin.meta: flush_handlers

- name: Verify the local Loki proxy is listening
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ monitoring_loki_proxy_port }}/ready"
    status_code: 200
  register: loki_proxy_health
  retries: 10
  delay: 2
  until: loki_proxy_health.status == 200
  changed_when: false