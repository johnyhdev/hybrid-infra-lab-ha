---
- name: Create node exporter user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Node Exporter configuration directory
  ansible.builtin.file:
    path: /etc/node_exporter
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create textfile collector directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: "0750"

- name: Validate Node Exporter architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['x86_64', 'aarch64', 'arm64']
    fail_msg: Node Exporter release pin supports only amd64 and arm64 hosts.

- name: Set Node Exporter release architecture
  ansible.builtin.set_fact:
    node_exporter_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"

- name: Download node exporter
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}-{{ node_exporter_arch }}.tar.gz"
    checksum: "sha256:{{ node_exporter_sha256[node_exporter_arch] }}"
    mode: "0644"

- name: Extract node exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}-{{ node_exporter_arch }}.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}-{{ node_exporter_arch }}"
    remote_src: true
    creates: "/tmp/node_exporter-{{ node_exporter_version }}-{{ node_exporter_arch }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"

- name: Install node exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}-{{ node_exporter_arch }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart node exporter

- name: Create node exporter service with optimized collectors
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network.target

      [Service]
      User=node_exporter
      Group=node_exporter
      ExecStart=/usr/local/bin/node_exporter \
        --web.listen-address="{{ azure_private_ip }}:{{ monitoring_node_exporter_port }}" \
        --web.config.file=/etc/node_exporter/web.yml \
        --collector.textfile.directory=/var/lib/node_exporter/textfile \
        --collector.disable-defaults \
        --collector.textfile \
        --collector.cpu \
        --collector.meminfo \
        --collector.diskstats \
        --collector.filesystem \
        --collector.netdev \
        --collector.loadavg \
        --collector.stat \
        --collector.time \
        --collector.uname
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: Restart node exporter

- name: Create Node Exporter web configuration
  ansible.builtin.copy:
    dest: /etc/node_exporter/web.yml
    owner: root
    group: node_exporter
    mode: "0640"
    content: |
      tls_server_config:
        cert_file: /etc/phase8/tls/tls.crt
        key_file: /etc/phase8/tls/tls.key
        min_version: TLS12
  notify: Restart node exporter

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable node exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
