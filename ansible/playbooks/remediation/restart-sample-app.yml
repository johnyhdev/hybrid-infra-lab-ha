---
- name: Recover only unhealthy local application services
  hosts: workload
  become: true
  serial: 1

  tasks:
    - name: Probe local application
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ sample_app_port }}/healthz"
        status_code: 200
      register: app_probe
      failed_when: false
      changed_when: false

    - name: Restart sample app only when readiness fails
      ansible.builtin.systemd:
        name: sample-app
        state: restarted
      when: app_probe.status | default(0) != 200

    - name: Verify local application recovery
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ sample_app_port }}/healthz"
        status_code: 200
      retries: 5
      delay: 2
      register: app_recovery
      until: app_recovery.status == 200
      changed_when: false
