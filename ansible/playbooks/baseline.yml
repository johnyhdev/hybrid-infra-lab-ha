---

- name: Configure Ubuntu control nodes
  hosts: control
  become: true
  serial: 1
  any_errors_fatal: true

  roles:
    - linux_baseline
    - data_disk
    - tailscale_tls
    - loki_proxy
    - log_collector


- name: Configure Ubuntu workload nodes
  hosts: workload
  become: true
  serial: "{{ workload_rollout_batch | default('25%') }}"
  any_errors_fatal: true

  roles:
    - linux_baseline
    - data_disk
