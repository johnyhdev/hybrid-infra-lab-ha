---

- name: Configure Ubuntu control nodes
  hosts: control
  become: true

  roles:
    - linux_baseline
    - data_disk
    - tailscale_tls
    - loki_proxy
    - node_exporter
    - log_collector


- name: Configure Ubuntu workload nodes
  hosts: workload
  become: true

  roles:
    - linux_baseline
    - data_disk
