---

- name: Remediate workload services
  hosts: workload
  become: true

  tasks:

    - name: Ensure Nginx is running
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    - name: Ensure sample application is running
      ansible.builtin.systemd:
        name: sample-app
        enabled: true
        state: started

    - name: Ensure Alloy is running
      ansible.builtin.systemd:
        name: alloy
        enabled: true
        state: started
