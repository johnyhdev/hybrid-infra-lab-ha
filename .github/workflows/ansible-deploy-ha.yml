name: Ansible CD Deploy HA

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
  workflow_run:
    workflows: ["Terraform VM Resource Apply HA"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional full commit SHA to redeploy after environment approval
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # ==========================================
  # JOB 1: Start immediately and post a comment while approval is pending
  # ==========================================
  notify-waiting:
    name: Notify PR Waiting Approval
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      pr_number: ${{ steps.find-pr.outputs.PR_NUMBER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Find Merged PR
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Finding PR for commit: $COMMIT_SHA"
          PR_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/pulls")

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number // empty')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            PR_NUMBER=$(gh pr list --state merged --base main --limit 1 --json number --jq '.[0].number')
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No pull request found."
            exit 0
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Found PR: #$PR_NUMBER"

      - name: Comment Ansible Waiting on PR
        if: steps.find-pr.outputs.PR_NUMBER != '' && steps.find-pr.outputs.PR_NUMBER != 'null'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.find-pr.outputs.PR_NUMBER }}
        run: |
          gh pr comment "$PR_NUMBER" --body "🚀 **Ansible CD Deploy HA** workflow has been triggered after Terraform apply.

          Environment \`tailscale-ci-ha\` is now **waiting for manual approval**.

          👉 [Review and Approve Workflow Run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"

  # ==========================================
  # JOB 2: Run Ansible deployment after any configured environment approval
  # ==========================================
  deploy:
    name: Ansible Continuous Deployment
    needs: notify-waiting
    # Khắc phục lỗi: Cho phép chạy khi push trực tiếp HOẶC khi notify-waiting thành công qua workflow_run
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.notify-waiting.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: tailscale-ci-ha # Requires approval if configured in GitHub
    env:
      SOURCE_SHA: ${{ inputs.release_sha || github.event.workflow_run.head_sha || github.sha }}
    concurrency:
      group: ansible-ha-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.event.workflow_run.head_sha || github.sha }}

      - name: Verify triggering commit
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$SOURCE_SHA"
          echo "Deploying reviewed source SHA $ACTUAL_SHA"

      - name: Package immutable approved source release
        run: |
          mkdir -p "$RUNNER_TEMP/phase8-release"
          git archive --format=tar "$SOURCE_SHA" | tar -xf - -C "$RUNNER_TEMP/phase8-release"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/phase8-release/.phase8-release-sha"
          tar -czf "$RUNNER_TEMP/phase8-release.tar.gz" -C "$RUNNER_TEMP/phase8-release" .
          (cd "$RUNNER_TEMP" && sha256sum phase8-release.tar.gz > phase8-release.tar.gz.sha256)

      - name: Connect to Tailscale Mesh Network via OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CI_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_CI_AUDIENCE }}
          tags: tag:ci

      - name: Resolve CM Node Hostname
        id: resolve_node
        run: |
          CM_IPS=()
          for attempt in $(seq 1 30); do
            if status=$(timeout 15s tailscale status --json) &&
              peers=$(jq -er '[
                .Peer[]? 
                | select((.Tags[]? == "tag:cm") and .Online == true) 
                | {
                    host: (.HostName // .DNSName // "" | split(".")[0]),
                    ip: .TailscaleIPs[0]
                  }
                | select(.ip != null)
              ] 
              | map(. + {base: (if .host | test("-[0-9]+-[0-9]+$") then .host | sub("-[0-9]+$"; "") else .host end)})
              | group_by(.base)
              | map(max_by(.host))
              | .[].ip' <<< "$status"); then
              mapfile -t CM_IPS <<< "$peers"
              break
            fi
            echo "No online CM is discoverable yet (attempt $attempt/30)."
            if [ "$attempt" -lt 30 ]; then sleep 10; fi
          done

          if [ "${#CM_IPS[@]}" -eq 0 ]; then
            echo "ERROR: No online CM nodes with tag:cm became available; deployment stopped."
            exit 1
          fi

          # JSON string hóa mảng IP an toàn tuyệt đối qua jq
          CM_IPS_JSON=$(printf '%s\n' "${CM_IPS[@]}" | jq -R . | jq -s .)
          echo "cm_ips=$CM_IPS_JSON" >> "$GITHUB_OUTPUT"
          echo "Resolved CM IPs: $CM_IPS_JSON"

      - name: Wait for CM Node Cloud-Init Completion
        id: cm-ready
        run: |
          mapfile -t CM_IPS < <(echo '${{ steps.resolve_node.outputs.cm_ips }}' | jq -r '.[]')
          MAX_RETRIES=30
          RETRY_COUNT=0
          READY_IPS=()
          
          until [ "${#READY_IPS[@]}" -eq "${#CM_IPS[@]}" ]; do
            READY_IPS=()
            for candidate in "${CM_IPS[@]}"; do
              if ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 "azureadmin@$candidate" "test -f /var/log/cloud-init-done.tag && { test -d /home/azureadmin/hybrid-infra-lab-ha || test -L /home/azureadmin/hybrid-infra-lab-ha; }" 2>/dev/null; then
                READY_IPS+=("$candidate")
              fi
            done
            if [ "${#READY_IPS[@]}" -eq "${#CM_IPS[@]}" ]; then break; fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "ERROR: All online CM nodes did not become ready after $((MAX_RETRIES * 5)) seconds."
              exit 1
            fi
            echo "Waiting for all online CM nodes to become ready... Retry $RETRY_COUNT/$MAX_RETRIES"
            sleep 5
          done
          READY_IPS_JSON=$(printf '%s\n' "${READY_IPS[@]}" | jq -R . | jq -sc .)
          echo "cm_ips=$READY_IPS_JSON" >> "$GITHUB_OUTPUT"
          echo "cm_ip=${READY_IPS[0]}" >> "$GITHUB_OUTPUT"
          echo "All online CM nodes are ready to stage the approved release."

      - name: Stage approved release on every CM
        run: |
          mapfile -t CM_IPS < <(echo '${{ steps.cm-ready.outputs.cm_ips }}' | jq -r '.[]')
          for CM_IP in "${CM_IPS[@]}"; do
            ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "azureadmin@$CM_IP" \
              'install -d -o azureadmin -g azureadmin -m 0750 /home/azureadmin/phase8-inbox'
            scp -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
              "$RUNNER_TEMP/phase8-release.tar.gz" \
              "$RUNNER_TEMP/phase8-release.tar.gz.sha256" \
              ansible/scripts/deploy-approved-release.sh \
              "azureadmin@$CM_IP:/home/azureadmin/phase8-inbox/"
            ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "azureadmin@$CM_IP" \
              "PHASE8_STAGE_ONLY=1 bash /home/azureadmin/phase8-inbox/deploy-approved-release.sh '$SOURCE_SHA' /home/azureadmin/phase8-inbox/phase8-release.tar.gz /home/azureadmin/phase8-inbox/phase8-release.tar.gz.sha256"
          done

      - name: Run staged canary rollout on selected CM
        run: |
          TARGET_IP="${{ steps.cm-ready.outputs.cm_ip }}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "azureadmin@$TARGET_IP" \
            "bash /home/azureadmin/phase8-inbox/deploy-approved-release.sh '$SOURCE_SHA' /home/azureadmin/phase8-inbox/phase8-release.tar.gz /home/azureadmin/phase8-inbox/phase8-release.tar.gz.sha256"

      - name: Synchronize last-good pointer across CMs
        run: |
          mapfile -t CM_IPS < <(echo '${{ steps.cm-ready.outputs.cm_ips }}' | jq -r '.[]')
          for CM_IP in "${CM_IPS[@]}"; do
            ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "azureadmin@$CM_IP" \
              "set -eu; RELEASE=/var/lib/phase8/releases/$SOURCE_SHA; test -f \"\$RELEASE/.approved-release\"; test \"\$(cat \"\$RELEASE/.approved-release\")\" = '$SOURCE_SHA'; ln -sfn \"\$RELEASE\" /var/lib/phase8/current.next; mv -Tf /var/lib/phase8/current.next /var/lib/phase8/current; ln -sfn \"\$RELEASE\" /var/lib/phase8/last-good; if [ -d /home/azureadmin/hybrid-infra-lab-ha ] && [ ! -L /home/azureadmin/hybrid-infra-lab-ha ]; then mv /home/azureadmin/hybrid-infra-lab-ha /var/lib/phase8/releases/legacy-checkout-\$(date -u +%Y%m%dT%H%M%SZ); fi; ln -sfn /var/lib/phase8/current /home/azureadmin/hybrid-infra-lab-ha"
          done

      - name: Comment Ansible Deploy HA Success on PR
        if: success() && needs.notify-waiting.outputs.pr_number != '' && needs.notify-waiting.outputs.pr_number != 'null'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.notify-waiting.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "✅ **Ansible CD Deploy HA** workflow completed successfully! Configuration management applied via Control Manager node."

      - name: Comment Ansible Deploy HA Failure on PR
        if: failure() && needs.notify-waiting.outputs.pr_number != '' && needs.notify-waiting.outputs.pr_number != 'null'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.notify-waiting.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "❌ **Ansible CD Deploy HA** workflow failed. Please check the [Workflow Run Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."