name: Ansible CD Deploy HA

on:
  push:
    branches:
      - main
    paths:
      - "ansible/**"
  workflow_run:
    workflows: ["Terraform VM Resource Apply HA"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # ==========================================
  # JOB 1: Start immediately and post a comment while approval is pending
  # ==========================================
  notify-waiting:
    name: Notify PR Waiting Approval
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      pr_number: ${{ steps.find-pr.outputs.PR_NUMBER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Find Merged PR
        id: find-pr
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "Finding PR for commit: $COMMIT_SHA"
          PR_JSON=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/pulls")

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.[0].number // empty')

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            PR_NUMBER=$(gh pr list --state merged --base main --limit 1 --json number --jq '.[0].number')
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No pull request found."
            exit 0
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Found PR: #$PR_NUMBER"

      - name: Comment Ansible Waiting on PR
        if: steps.find-pr.outputs.PR_NUMBER != '' && steps.find-pr.outputs.PR_NUMBER != 'null'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.find-pr.outputs.PR_NUMBER }}
        run: |
          gh pr comment "$PR_NUMBER" --body "🚀 **Ansible CD Deploy HA** workflow has been triggered after Terraform apply.

          Environment \`tailscale-ci-ha\` is now **waiting for manual approval**.

          👉 [Review and Approve Workflow Run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"

  # ==========================================
  # JOB 2: Run Ansible deployment after any configured environment approval
  # ==========================================
  deploy:
    name: Ansible Continuous Deployment
    needs: notify-waiting
    # Khắc phục lỗi: Cho phép chạy khi push trực tiếp HOẶC khi notify-waiting thành công qua workflow_run
    if: ${{ always() && (github.event_name == 'push' || needs.notify-waiting.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: tailscale-ci-ha # Requires approval if configured in GitHub
    concurrency:
      group: ansible-ha-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify triggering commit
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Deploying reviewed source SHA $ACTUAL_SHA"

      - name: Connect to Tailscale Mesh Network via OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CI_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_CI_AUDIENCE }}
          tags: tag:ci

      - name: Resolve CM Node Hostname
        id: resolve_node
        run: |
          mapfile -t CM_IPS < <(tailscale status --json | jq -r '.Peer[]? | select((.Tags[]? == "tag:cm") and .Online == true) | .TailscaleIPs[0]')
          if [ "${#CM_IPS[@]}" -eq 0 ]; then
            echo "No online CM nodes with tag:cm are currently available."
            exit 1
          fi
          # JSON string hóa mảng IP an toàn tuyệt đối qua jq
          CM_IPS_JSON=$(printf '%s\n' "${CM_IPS[@]}" | jq -R . | jq -s .)
          echo "cm_ips=$CM_IPS_JSON" >> "$GITHUB_OUTPUT"

      - name: Wait for CM Node Cloud-Init Completion
        id: cm-ready
        run: |
          # Đọc ngược chuỗi JSON từ output trở lại thành mảng Bash an toàn
          mapfile -t CM_IPS < <(echo '${{ steps.resolve_node.outputs.cm_ips }}' | jq -r '.[]')
          MAX_RETRIES=30
          RETRY_COUNT=0
          TARGET_IP=""
          
          until [ -n "$TARGET_IP" ]; do
            for candidate in "${CM_IPS[@]}"; do
              if ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 "azureadmin@$candidate" "test -f /var/log/cloud-init-done.tag && test -d /home/azureadmin/hybrid-infra-lab-ha" 2>/dev/null; then
                TARGET_IP="$candidate"
                break
              fi
            done
            if [ -n "$TARGET_IP" ]; then break; fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "ERROR: No CM node became ready after $((MAX_RETRIES * 5)) seconds."
              exit 1
            fi
            echo "Waiting for a CM node to become ready... Retry $RETRY_COUNT/$MAX_RETRIES"
            sleep 5
          done
          echo "cm_ip=$TARGET_IP" >> "$GITHUB_OUTPUT"
          echo "CM Node Cloud-Init and Repository setup are 100% ready!"

      - name: Trigger Remote Ansible Execution on CM Node
        run: |
          TARGET_IP="${{ steps.cm-ready.outputs.cm_ip }}"
          SOURCE_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "azureadmin@$TARGET_IP" \
            "cd /home/azureadmin/hybrid-infra-lab-ha && git fetch origin '$SOURCE_SHA' && git checkout --detach '$SOURCE_SHA' && chmod +x ansible/run.sh ansible/inventory/generate_inventory.sh && cd ansible && ./run.sh && bash ./scripts/smoke-test.sh"

      - name: Comment Ansible Deploy HA Success on PR
        if: success() && needs.notify-waiting.outputs.pr_number != '' && needs.notify-waiting.outputs.pr_number != 'null'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.notify-waiting.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "✅ **Ansible CD Deploy HA** workflow completed successfully! Configuration management applied via Control Manager node."

      - name: Comment Ansible Deploy HA Failure on PR
        if: failure() && needs.notify-waiting.outputs.pr_number != '' && needs.notify-waiting.outputs.pr_number != 'null'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.notify-waiting.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "❌ **Ansible CD Deploy HA** workflow failed. Please check the [Workflow Run Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."