name: Ansible Check HA

on:
  pull_request:
    paths:
      - "ansible/**"
      - "terraform/**/*.tf"
      - "bootstrap/**"
      - "tailscale/**"
      - "docs/phase-8/**"
      - ".github/agents/**"
      - ".github/workflows/ansible-check.yml"

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- [Optimized: CACHE PYTHON PIP CHO ANSIBLE & LINT] ---
      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ansible-${{ hashFiles('ansible/requirements.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-ansible-

      - name: Install Ansible & Ansible Lint
        run: |
          python -m pip install --upgrade pip
          pip install -r ansible/requirements.txt ansible-lint==25.9.0

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Validate repository without cloud credentials
        run: bash ansible/scripts/validate-repo.sh

      - name: Syntax check
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles:${{ github.workspace }}/ansible/playbooks/roles
        run: |
          ansible-playbook \
            -i ansible/inventory/hosts.yml \
            ansible/playbooks/site.yml \
            --syntax-check

      - name: Run ansible-lint
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles:${{ github.workspace }}/ansible/playbooks/roles
        run: |
          ansible-lint ansible/

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}